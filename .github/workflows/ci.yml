name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore FacilityFlow.sln
      - run: dotnet build FacilityFlow.sln --configuration Release --no-restore
      - run: dotnet test FacilityFlow.sln --configuration Release --no-build
