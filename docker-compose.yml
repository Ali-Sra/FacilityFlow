services:
  api:
    build:
      context: .
      dockerfile: src/FacilityFlow.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Data Source=/app/data/facilityflow.db
      AllowedOrigins__Web: http://localhost:8080
    ports:
      - "8081:8080"
    volumes:
      - facilityflow-data:/app/data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: src/FacilityFlow.Web/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ApiBaseUrl: http://api:8080/
    ports:
      - "8080:8080"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  facilityflow-data: